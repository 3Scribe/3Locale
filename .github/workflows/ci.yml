name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:d1
      - run: npm run build
      - run: npm run build:cloudflare
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:cloudflare
      - run: npm run test:machine:e2e
